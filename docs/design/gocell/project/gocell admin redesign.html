<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>gocell · admin redesign</title>

<link rel="stylesheet" href="tokens.css" />
<link rel="stylesheet" href="v1-linear.css" />
<link rel="stylesheet" href="v2-vercel.css" />
<link rel="stylesheet" href="v3-notion.css" />
<link rel="stylesheet" href="v4-editorial.css" />

<style>
  html, body, #root { height: 100%; margin: 0; }
  .dc-artboard-frame, .dc-artboard {
    background: var(--bg);
  }
  .v1-root, .v2-root, .v3-root, .v4-root { width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="data.js"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="v1-linear.jsx"></script>
<script type="text/babel" src="v2-vercel.jsx"></script>
<script type="text/babel" src="v3-notion.jsx"></script>
<script type="text/babel" src="v4-editorial.jsx"></script>

<script type="text/babel" data-presets="react">
const App = () => (
  <window.DesignCanvas title="gocell · admin redesign — 4 directions">
    <window.DCSection id="main" title="Four directions">
      <window.DCArtboard id="v1" label="V1 — Linear · calm + keyboard-first" width={1280} height={820}>
        <window.V1 />
      </window.DCArtboard>
      <window.DCArtboard id="v2" label="V2 — Vercel/Railway · dark ops console + ⌘K" width={1280} height={820}>
        <window.V2 />
      </window.DCArtboard>
      <window.DCArtboard id="v3" label="V3 — Notion canvas · card list + inspector pane" width={1440} height={820}>
        <window.V3 />
      </window.DCArtboard>
      <window.DCArtboard id="v4" label="V4 — Editorial · bold serif/mono · super-modern" width={1280} height={900}>
        <window.V4 />
      </window.DCArtboard>
    </window.DCSection>
  </window.DesignCanvas>
);
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
