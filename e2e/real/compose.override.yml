services:
  postgres:
    ports: !override []
  redis:
    ports: !override []
  rabbitmq:
    ports: !override []
  minio:
    ports: !override []
  server:
    environment:
      RSS_ACCESS_TOKEN_TTL_SECS: ${RSS_WEB_REAL_ACCESS_TOKEN_TTL_SECS:-2}
      RSS_RATE_LIMIT_PER_SECOND: ${RSS_WEB_REAL_RATE_LIMIT_PER_SECOND:-100}
      RSS_RATE_LIMIT_BURST: ${RSS_WEB_REAL_RATE_LIMIT_BURST:-200}
      RSS_HTTP_SERVER_REQUEST_BUDGET_MS: ${RSS_WEB_REAL_REQUEST_BUDGET_MS:-30000}
    ports: !override []
  edge:
    build:
      context: ${RSS_WEB_ROOT:?RSS_WEB_ROOT is required}
      dockerfile: deploy/web/Dockerfile
      args:
        RSS_WEB_BUILD_REVISION: ${RSS_WEB_BUILD_REVISION:?Web build revision is required}
    environment:
      RSS_WEB_TENANT_ID: ${RSS_WEB_REAL_TENANT_ID:?RSS_WEB_REAL_TENANT_ID is required}
      RSS_WEB_PRIMARY_HOST: server
      RSS_WEB_PRIMARY_PORT: ${RSS_WEB_REAL_PRIMARY_PORT:-8080}
      RSS_WEB_ADMIN_HOST: server
      RSS_WEB_ADMIN_PORT: ${RSS_WEB_REAL_ADMIN_PORT:-8082}
    depends_on:
      server:
        condition: service_started
    ports:
      - '127.0.0.1:${RSS_WEB_REAL_EDGE_PORT:?RSS_WEB_REAL_EDGE_PORT is required}:80'
