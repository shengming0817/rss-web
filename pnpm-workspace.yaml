# pnpm workspace — 平铺 monorepo
# catalog: 单点钉死全部第三方版本；业务包一律以 "catalog:" 引用，禁止硬编版本号。
packages:
  - apps/*
  - packages/*

# 仅放行现有构建与 ESLint resolver 所需的安装脚本。
allowBuilds:
  esbuild: true
  unrs-resolver: true

catalog:
  # —— 运行时核心 ——
  '@noble/hashes': 2.4.0
  axios: ^1.7.9
  # —— 构建 / 类型工具 ——
  vite: ^6.0.7
  typescript: ^5.7.3
  '@types/node': ^22.10.5
  # —— 样式 ——
  # Synthetic HTTP demo validates the backend's finite JSON Schema subset.
  ajv: 8.20.0
  json-schema-to-typescript: 16.0.0
  esbuild: 0.25.12
  # —— 测试 ——
  playwright: 1.63.0
  vitest: ^3.0.4
  jsdom: ^25.0.1
  '@vitest/coverage-v8': ^3.0.4
  axios-mock-adapter: ^2.1.0
  # —— Lint / format / git hooks ——
  eslint: ^9.18.0
  '@eslint/js': ^9.18.0
  typescript-eslint: ^8.20.0
  eslint-plugin-import-x: ^4.6.1
  eslint-import-resolver-typescript: ^3.7.0
  eslint-config-prettier: ^9.1.0
  prettier: ^3.4.2
  husky: ^9.1.7
  lint-staged: ^15.3.0

  # React applications
  react: 19.3.1
  react-dom: 19.3.1
  antd: 6.6.8
  '@vitejs/plugin-react': 4.7.0
  react-router-dom: 7.18.5
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@ant-design/static-style-extract': 2.1.0
  '@ant-design/cssinjs': 2.1.2
