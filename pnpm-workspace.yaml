# pnpm workspace — 平铺 monorepo（对标 vbenjs/vue-vben-admin）
# catalog: 单点钉死全部第三方版本；业务包一律以 "catalog:" 引用，禁止硬编版本号。
packages:
  - apps/*
  - packages/*
  - tools/*

# 仅放行 esbuild 平台二进制安装脚本（Vite 依赖）和 core-js 构建脚本；其余包默认禁止 postinstall。
allowBuilds:
  '@parcel/watcher': true
  core-js: true
  esbuild: true
  unrs-resolver: true

catalog:
  # —— 运行时核心 ——
  vue: ^3.5.13
  vue-router: ^4.5.0
  pinia: ^3.0.1
  ant-design-vue: ^4.2.6
  '@ant-design/icons-vue': ^7.0.1
  axios: ^1.7.9
  vue-i18n: ^11.1.1
  # —— 构建 / 类型工具 ——
  vite: ^6.0.7
  '@vitejs/plugin-vue': ^5.2.1
  typescript: ^5.7.3
  vue-tsc: ^2.2.0
  '@types/node': ^22.10.5
  # —— YAML 解析（tools/cell-manifest）——
  yaml: ^2.6.0
  # —— codegen 工具链（tools/codegen）——
  # 注：codegen 工具链升版后须本地重跑 `pnpm codegen && git add packages/contracts/src/`，
  # 否则 formatter 输出微变会触发 CI codegen-diff 误红。
  json-schema-to-typescript: ^15.0.4
  tsx: ^4.19.2
  # —— 样式 ——
  sass: ^1.83.0
  # —— 测试 ——
  vitest: ^3.0.4
  '@vue/test-utils': ^2.4.6
  '@pinia/testing': ^1.0.0
  jsdom: ^25.0.1
  '@vitest/coverage-v8': ^3.0.4
  axios-mock-adapter: ^2.1.0
  '@playwright/test': ^1.49.1
  # —— Lint / format / git hooks（边界双锁 + SC-010）——
  eslint: ^9.18.0
  '@eslint/js': ^9.18.0
  typescript-eslint: ^8.20.0
  eslint-plugin-vue: ^9.32.0
  vue-eslint-parser: ^9.4.3
  eslint-plugin-import-x: ^4.6.1
  eslint-import-resolver-typescript: ^3.7.0
  eslint-plugin-vuejs-accessibility: ^2.4.1
  eslint-config-prettier: ^9.1.0
  prettier: ^3.4.2
  husky: ^9.1.7
  lint-staged: ^15.3.0
