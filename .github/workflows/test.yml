# Product apps: 类型、静态检查、业务测试和生产构建
# on PR + push develop
name: test

on:
  pull_request:
  push:
    branches: [develop]

jobs:
  # ── 单测 + lint + 构建 ─────────────────────────────────────────────────────
  unit:
    name: typecheck / lint / test / build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Complete Web checks (collect all failures)
        run: make ci
