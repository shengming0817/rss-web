# Identity: 类型、静态检查、业务测试和生产构建
# on PR + push develop
name: test

on:
  pull_request:
  push:
    branches: [develop]

jobs:
  # ── 单测 + lint + 构建 ─────────────────────────────────────────────────────
  unit:
    name: typecheck / lint / test / build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Unit tests (with coverage)
        run: pnpm test:coverage

      # Boundary self-check (ESLint Node API) runs uninstrumented: under v8
      # coverage the type-aware lint engine is ~12x slower and starves the
      # vitest reporter RPC (onTaskUpdate timeout). Coverage adds no value for
      # this enforcement spec, so it runs as its own fast step.
      - name: Boundary self-check (no coverage)
        run: pnpm test:boundary

      - name: Build Identity app and scan production assets
        run: pnpm build
