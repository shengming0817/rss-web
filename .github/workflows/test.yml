# T023/T028: 单测 + lint + 构建 + Playwright 冒烟 CI
# on PR + push develop
name: test

env:
  RSS_WEB_REVISION: ${{ github.sha }}

on:
  pull_request:
  push:
    branches: [develop]

jobs:
  # ── 单测 + lint + 构建 ─────────────────────────────────────────────────────
  unit:
    name: typecheck / lint / test / build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Unit tests (with coverage)
        run: pnpm test:coverage

      # Boundary self-check (ESLint Node API) runs uninstrumented: under v8
      # coverage the type-aware lint engine is ~12x slower and starves the
      # vitest reporter RPC (onTaskUpdate timeout). Coverage adds no value for
      # this enforcement spec, so it runs as its own fast step.
      - name: Boundary self-check (no coverage)
        run: pnpm test:boundary

      - name: Build web
        run: pnpm -F @rss/web build
        env:
          VITE_CONFIG_CATALOG_PREVIEW: 'true'
          VITE_CONFIG_HISTORY_PREVIEW: 'true'

      - name: Build central Identity app
        run: pnpm -F @rss/identity-app build && pnpm check:identity-app:build
        env:
          RSS_IDENTITY_WEB_REVISION: ${{ github.sha }}

      - name: Verify RSS-only build identity
        run: pnpm check:identity:build

      - name: Verify production Preview absence
        run: pnpm check:preview:build

      - name: Build explicitly enabled demo Preview
        run: pnpm build:preview:demo

  # ── Playwright 冒烟（shell + 主题切换，无后端依赖） ─────────────────────────
  e2e:
    name: Playwright smoke
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers (chromium only)
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E smoke tests
        run: pnpm test:e2e
        env:
          CI: true

      - name: Run Identity browser interaction tests
        run: pnpm test:e2e:identity
        env:
          CI: true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  edge:
    name: Edge routing smoke
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser (chromium only)
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser + Docker/Nginx Edge smoke
        run: pnpm test:edge
