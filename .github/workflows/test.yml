# Product apps: 类型、静态检查、业务测试和生产构建
# on PR + push develop
name: test

on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  # ── 单测 + lint + 构建 ─────────────────────────────────────────────────────
  unit:
    name: typecheck / lint / test / build
    # The backend and its Cargo Git dependencies are private.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    environment: rss-mdm-contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install MDM export build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxml2-dev clang pkg-config

      - name: Prepare pinned MDM HTTP contract
        env:
          RSS_AZURE_REPOS_READ_PAT: ${{ secrets.RSS_AZURE_REPOS_READ_PAT }}
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_PROFILE_DEV_INCREMENTAL: 'false'
        run: |
          : "${RSS_AZURE_REPOS_READ_PAT:?Configure the Azure Repos read-only PAT in the rss-mdm-contract environment}"
          auth="$(printf ':%s' "$RSS_AZURE_REPOS_READ_PAT" | base64 -w0)"
          echo "::add-mask::$auth"
          make prepare-contract

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Complete Web checks (collect all failures)
        run: make ci
