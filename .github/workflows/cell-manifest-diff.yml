# SC-010：cell manifest 只读守门（AI-robust Hard）。
# 跑 `pnpm cell-manifest` 后断言 packages/devboard/src/manifest/ 无 diff —— 手改生成物即红。
name: cell-manifest-diff

on:
  pull_request:
  push:
    branches: [develop]

jobs:
  cell-manifest-readonly:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gocell-web
        uses: actions/checkout@v4
        with:
          path: gocell-web

      # 读取 pin 的后端 SHA（tools/.gocell-ref，注释行剔除）。CI 钉死该 SHA 而非
      # 追后端 develop HEAD（见 ADR docs/adr/20260618-01-pin-backend-contract-ref.md）。
      - name: Read pinned backend ref
        id: backendref
        run: echo "ref=$(grep -vE '^[[:space:]]*#' gocell-web/tools/.gocell-ref | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      # 后端 cells 源（公开仓库 ghbvf/gocell），checkout pin 的 SHA 为 gocell-web 同级目录
      # （cell-manifest 默认读 ../gocell/corecells）。
      - name: Checkout gocell (backend cells) at pinned ref
        uses: actions/checkout@v4
        with:
          repository: ghbvf/gocell
          ref: ${{ steps.backendref.outputs.ref }}
          path: gocell

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: gocell-web/pnpm-lock.yaml

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
        working-directory: gocell-web

      - name: Regenerate cell manifest
        run: pnpm cell-manifest
        working-directory: gocell-web

      # 守门：cell manifest 产物须与提交完全一致。
      # 使用 `git status --porcelain` 同时覆盖 修改/新增/删除 三种漂移。
      - name: Assert cell manifest is read-only (no manual edits / uncommitted)
        run: |
          if [ -n "$(git status --porcelain packages/devboard/src/manifest/)" ]; then
            echo "::error::packages/devboard/src/manifest/ 与 cell-manifest 输出不一致（含未提交的新增/修改/删除）。请本地跑 \`pnpm cell-manifest\` 后提交。"
            git status --porcelain packages/devboard/src/manifest/
            git diff packages/devboard/src/manifest/
            exit 1
          fi
        working-directory: gocell-web

      # 守门第二段：生成物未漂移后，确认下游消费端类型未被破坏。
      - name: Typecheck downstream consumers
        run: pnpm -w typecheck
        working-directory: gocell-web
