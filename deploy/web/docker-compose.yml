# RSS Web 前端容器（nginx 托管 SPA）。
#
# 用法（在 deploy/web/ 下）：
#   docker compose up -d --build
#   打开 http://localhost:8081
services:
  web:
    build:
      context: ../.. # 仓库根（pnpm workspace 需全量源码 + lockfile）
      dockerfile: deploy/web/Dockerfile
    image: rss-web:local
    container_name: rss-web
    ports:
      - '8081:80'
    restart: unless-stopped
