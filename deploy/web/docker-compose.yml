# RSS Web 前端与 same-origin Edge。
#
# 用法（在 deploy/web/ 下）：
#   RSS_WEB_TENANT_ID=<canonical-tenant-uuid> docker compose up -d --build
#   打开 http://localhost:8088
# host.docker.internal 与端口默认值仅用于本地开发；生产部署必须显式固定。
services:
  web:
    build:
      context: ../.. # 仓库根（pnpm workspace 需全量源码 + lockfile）
      dockerfile: deploy/web/Dockerfile
      args:
        RSS_WEB_BUILD_REVISION: ${RSS_WEB_BUILD_REVISION:?40-character Web revision required}
    image: rss-web:local
    container_name: rss-web
    ports:
      - '${RSS_WEB_PORT:-8088}:80'
    environment:
      RSS_WEB_TENANT_ID: '${RSS_WEB_TENANT_ID:?canonical deployment tenant required}'
      RSS_WEB_PRIMARY_HOST: '${RSS_WEB_PRIMARY_HOST:-host.docker.internal}'
      RSS_WEB_PRIMARY_PORT: '${RSS_WEB_PRIMARY_PORT:-8080}'
      RSS_WEB_ADMIN_HOST: '${RSS_WEB_ADMIN_HOST:-host.docker.internal}'
      RSS_WEB_ADMIN_PORT: '${RSS_WEB_ADMIN_PORT:-8081}'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped
